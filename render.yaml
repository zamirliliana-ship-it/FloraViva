services:
  - type: web
    name: floraviva-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: FLORAVIVA_ADMIN_EMAIL
        sync: false
      - key: ADMIN_OTP_SECRET
        sync: false
      - key: ADMIN_SESSION_SECRET
        sync: false
      - key: GOOGLE_APPS_SCRIPT_URL
        sync: false
      - key: GOOGLE_APPS_SCRIPT_SECRET
        sync: false
      - key: USER_EMAIL_OTP_SECRET
        sync: false
      - key: FLORAVIVA_APP_URL
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      - key: PLANTNET_API_KEY
        sync: false
